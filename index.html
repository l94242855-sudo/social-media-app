<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7C3AED" />
    <title>ConnectHub - Social Platform</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        /* ============================================
           COMPLETE CSS (Includes Splash Screen)
           ============================================ */
        :root {
            --primary: #7C3AED;
            --primary-dark: #6D28D9;
            --primary-light: #A78BFA;
            --primary-gradient: linear-gradient(135deg, #7C3AED, #6D28D9);
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #64748B;
            --border: #E2E8F0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
            --shadow-xl: 0 20px 60px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #F8FAFC;
            --text-light: #94A3B8;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            transition: var(--transition);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

        /* ============================================
           SPLASH SCREEN
           ============================================ */
        #splashScreen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        #splashScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-logo {
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.2);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: pulse 1.5s ease-in-out infinite;
        }
        .splash-logo i {
            font-size: 60px;
            color: white;
        }
        .splash-text {
            margin-top: 24px;
            font-size: 32px;
            font-weight: 900;
            color: white;
            letter-spacing: 2px;
        }
        .splash-text span {
            opacity: 0.8;
        }
        .splash-loader {
            margin-top: 40px;
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================
           AUTH SCREEN
           ============================================ */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #EEF2FF 0%, #C7D2FE 50%, #A78BFA 100%);
            padding: 20px;
            position: relative;
        }

        [data-theme="dark"] .auth-container {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #2D1B4E 100%);
        }

        .auth-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .auth-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-xl);
            padding: 48px;
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-header { text-align: center; margin-bottom: 32px; }
        
        .auth-logo {
            width: 80px;
            height: 80px;
            background: var(--primary-gradient);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.35);
            position: relative;
            transition: var(--transition);
        }
        .auth-logo:hover { transform: scale(1.05) rotate(-5deg); }
        .auth-logo i { font-size: 36px; color: white; }
        .auth-logo .logo-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #FCD34D;
            border-radius: 50%;
            bottom: -4px;
            right: -4px;
            border: 3px solid var(--card);
        }

        .auth-card h1 {
            font-size: 28px;
            font-weight: 900;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .auth-card h1 span { color: var(--primary); }
        .auth-subtitle {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 4px;
        }

        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }
        .form-group label i { color: var(--primary); width: 20px; }
        .form-group input {
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }
        .btn-full { width: 100%; }
        
        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
        }
        
        .btn-google {
            background: var(--card);
            color: var(--text);
            border: 2px solid var(--border);
        }
        .btn-google:hover { border-color: var(--primary); }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover { background: var(--primary); color: white; }

        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--text-light);
            font-size: 18px;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover { background: var(--bg); color: var(--text); }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .auth-divider span {
            padding: 0 16px;
            font-size: 12px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-light);
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .auth-footer a:hover { text-decoration: underline; }

        /* ============================================
           OTP SCREEN
           ============================================ */
        .otp-container {
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #EEF2FF 0%, #C7D2FE 100%);
            padding: 20px;
        }

        .otp-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-xl);
            padding: 48px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .otp-card .icon { font-size: 64px; color: var(--primary); margin-bottom: 16px; }
        .otp-card h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
        .otp-card p { color: var(--text-light); margin-bottom: 24px; }

        .otp-input-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 24px 0;
        }
        .otp-input-group input {
            width: 50px;
            height: 56px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
        }
        .otp-input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
        }

        .otp-card .resend-timer {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 16px;
        }
        .otp-card .resend-timer span { color: var(--primary); font-weight: 600; cursor: pointer; }

        .error-message { color: #EF4444; font-size: 13px; margin-top: 8px; display: none; }
        .success-message { color: #10B981; font-size: 13px; margin-top: 8px; display: none; }

        /* ============================================
           MAIN APP
           ============================================ */
        .app-container {
            display: none;
            height: 100vh;
            flex-direction: column;
            background: var(--bg);
        }

        /* ============================================
           BOTTOM NAV
           ============================================ */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 6px 0 env(safe-area-inset-bottom, 8px) 0;
            flex-shrink: 0;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 12px;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
            border: none;
            background: none;
            font-family: inherit;
            font-size: 9px;
            font-weight: 500;
            position: relative;
        }
        .nav-item i { font-size: 22px; transition: var(--transition); }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: scale(1.1); }
        .nav-item:hover { color: var(--primary); }
        .nav-item .badge {
            position: absolute;
            top: 0;
            right: 0;
            background: #EF4444;
            color: white;
            font-size: 9px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============================================
           SCREENS
           ============================================ */
        .screen {
            display: none;
            flex: 1;
            overflow-y: auto;
            background: var(--bg);
            padding: 0 0 80px 0;
        }
        .screen.active { display: block; }

        /* ============================================
           HOME - STORIES BAR
           ============================================ */
        .stories-bar {
            display: flex;
            gap: 12px;
            padding: 16px;
            overflow-x: auto;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .story-item:hover { transform: scale(1.05); }
        .story-item .ring {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            padding: 3px;
            background: var(--primary-gradient);
        }
        .story-item .ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--card);
        }
        .story-item .add-story {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 2px dashed var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--primary);
            background: var(--bg);
        }
        .story-item span {
            font-size: 11px;
            color: var(--text-light);
            max-width: 68px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ============================================
           POSTS
           ============================================ */
        .post-card {
            background: var(--card);
            border-radius: var(--radius);
            margin: 12px 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: var(--transition);
        }
        .post-card:hover { box-shadow: var(--shadow-lg); }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
        }
        .post-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
        }
        .post-header .post-user {
            flex: 1;
        }
        .post-header .post-user .name {
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .post-header .post-user .name:hover { color: var(--primary); }
        .post-header .post-user .time {
            font-size: 12px;
            color: var(--text-light);
        }
        .post-header .more-btn {
            color: var(--text-light);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .post-header .more-btn:hover { background: var(--bg); }

        .post-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            cursor: pointer;
        }
        
        .post-text {
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.6;
        }

        .post-actions {
            display: flex;
            gap: 12px;
            padding: 8px 16px 12px;
            border-top: 1px solid var(--border);
        }
        .post-actions button {
            border: none;
            background: none;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-light);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .post-actions button:hover { background: var(--bg); color: var(--primary); }
        .post-actions button.liked { color: #EF4444; }
        .post-actions button .count { font-size: 13px; font-weight: 500; }

        .post-comments {
            padding: 8px 16px 12px;
            border-top: 1px solid var(--border);
        }
        .post-comments .comment-input {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .post-comments .comment-input input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
        }
        .post-comments .comment-input input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .post-comments .comment-input button {
            padding: 8px 16px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }
        .post-comments .comment-input button:hover { transform: scale(1.05); }

        .comment-item {
            display: flex;
            gap: 10px;
            padding: 6px 0;
            animation: slideIn 0.3s ease;
        }
        .comment-item img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }
        .comment-item .content .name {
            font-weight: 600;
            font-size: 12px;
            color: var(--text);
        }
        .comment-item .content .text {
            font-size: 13px;
            color: var(--text-light);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================
           EXPLORE
           ============================================ */
        .explore-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
        }
        .explore-grid img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            cursor: pointer;
            transition: var(--transition);
        }
        .explore-grid img:hover { opacity: 0.8; }

        /* ============================================
           CREATE
           ============================================ */
        .create-container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .create-container h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 16px;
        }
        .create-container textarea {
            width: 100%;
            min-height: 150px;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            font-family: inherit;
            background: var(--card);
            color: var(--text);
            resize: vertical;
            transition: var(--transition);
        }
        .create-container textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
        }
        .create-container .btn-primary {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            margin-top: 16px;
        }

        /* ============================================
           MESSAGES / CHAT
           ============================================ */
        .chat-list { padding: 12px 16px; }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius);
            transition: var(--transition);
            cursor: pointer;
        }
        .chat-item:hover { background: var(--bg); }
        .chat-item img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }
        .chat-item .info { flex: 1; }
        .chat-item .info .name { font-weight: 600; font-size: 15px; }
        .chat-item .info .last-msg {
            font-size: 13px;
            color: var(--text-light);
        }
        .chat-item .time {
            font-size: 11px;
            color: var(--text-light);
        }

        /* ============================================
           PROFILE
           ============================================ */
        .profile-header {
            background: var(--card);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .profile-header .cover {
            width: 100%;
            height: 140px;
            background: var(--primary-gradient);
            border-radius: var(--radius);
            margin-bottom: -50px;
            position: relative;
            overflow: hidden;
        }
        .profile-header .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-header .avatar-wrapper {
            position: relative;
            display: inline-block;
        }
        .profile-header .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid var(--card);
            object-fit: cover;
            transition: var(--transition);
        }
        .profile-header .avatar:hover { transform: scale(1.02); }
        .profile-header .avatar-edit {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: var(--primary);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .profile-header .avatar-edit:hover { transform: scale(1.1); }

        .profile-header .name {
            font-size: 22px;
            font-weight: 800;
            margin-top: 8px;
        }
        .profile-header .username {
            color: var(--text-light);
            font-size: 14px;
            font-weight: 500;
        }
        .profile-header .bio {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 4px;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
        }
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 16px 0;
        }
        .profile-stats .stat { text-align: center; cursor: pointer; }
        .profile-stats .stat .number {
            font-weight: 800;
            font-size: 20px;
            color: var(--text);
        }
        .profile-stats .stat .label {
            font-size: 12px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .profile-stats .stat:hover .number { color: var(--primary); }

        .profile-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 12px 0;
        }
        .profile-actions .btn {
            padding: 8px 24px;
            font-size: 13px;
        }

        .profile-posts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
        }
        .profile-posts .post-item {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            cursor: pointer;
        }
        .profile-posts .post-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }
        .profile-posts .post-item:hover img { transform: scale(1.05); }
        .profile-posts .post-item .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition);
            gap: 16px;
        }
        .profile-posts .post-item:hover .overlay { opacity: 1; }
        .profile-posts .post-item .overlay span {
            color: white;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ============================================
           SETTINGS
           ============================================ */
        .settings-container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .settings-container h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 20px;
        }
        .settings-group {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .settings-group h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
        }
        .settings-group .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
        }
        .settings-group .setting-item:last-child { border-bottom: none; }
        .settings-group .setting-item:hover { padding-left: 8px; }
        .settings-group .setting-item .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .settings-group .setting-item .left i {
            width: 24px;
            color: var(--primary);
            font-size: 16px;
        }
        .settings-group .setting-item .left .title {
            font-weight: 500;
            font-size: 14px;
        }
        .settings-group .setting-item .left .desc {
            font-size: 12px;
            color: var(--text-light);
        }
        .settings-group .setting-item .right {
            color: var(--text-light);
            font-size: 14px;
        }
        .settings-group .setting-item .toggle {
            width: 48px;
            height: 28px;
            background: var(--border);
            border-radius: var(--radius-full);
            position: relative;
            cursor: pointer;
            transition: var(--transition);
        }
        .settings-group .setting-item .toggle.active {
            background: var(--primary);
        }
        .settings-group .setting-item .toggle .dot {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: var(--transition);
        }
        .settings-group .setting-item .toggle.active .dot {
            left: 23px;
        }

        /* ============================================
           NOTIFICATIONS
           ============================================ */
        .notif-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--card);
            border-radius: var(--radius);
            margin-bottom: 8px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
        }
        .notif-item:hover { box-shadow: var(--shadow-lg); }
        .notif-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;

        }
        .notif-item .content { flex: 1; }
        .notif-item .content .text {
            font-size: 14px;
        }
        .notif-item .content .text strong { color: var(--primary); }
        .notif-item .content .time {
            font-size: 12px;
            color: var(--text-light);
        }
        .notif-item .unread {
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
        }

        /* ============================================
           TOAST
           ============================================ */
        #toastContainer {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 14px 20px;
            background: #1E293B;
            color: white;
            border-radius: 12px;
            animation: slideUp 0.3s ease;
            box-shadow: var(--shadow-lg);
            max-width: 350px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.success { border-left: 4px solid #10B981; }
        .toast.error { border-left: 4px solid #EF4444; }
        .toast.info { border-left: 4px solid #7C3AED; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .auth-card { padding: 32px 24px; margin: 16px; }
            .otp-card { padding: 32px 24px; margin: 16px; }
            .post-card { margin: 8px 8px; }
            .stories-bar { padding: 12px; gap: 8px; }
            .story-item .ring { width: 56px; height: 56px; }
            .story-item .add-story { width: 56px; height: 56px; font-size: 22px; }
            .nav-item { padding: 4px 10px; font-size: 8px; }
            .nav-item i { font-size: 18px; }
            #toastContainer { right: 10px; left: 10px; bottom: 80px; }
            .otp-input-group input { width: 40px; height: 48px; font-size: 20px; }
            .profile-stats { gap: 20px; }
            .settings-container { padding: 12px; }
        }

        @media (max-width: 480px) {
            .auth-card { padding: 24px 16px; }
            .otp-card { padding: 24px 16px; }
            .profile-stats { gap: 12px; }
            .profile-stats .stat .number { font-size: 16px; }
            .post-actions { flex-wrap: wrap; }
            .otp-input-group input { width: 36px; height: 44px; font-size: 18px; }
        }

        .hidden { display: none !important; }

        /* ============================================
           LOADING
           ============================================ */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            gap: 8px;
            color: var(--text-light);
        }
        .loading-spinner i {
            font-size: 24px;
            color: var(--primary);
        }

        /* ============================================
           SPLASH SCREEN (additional styling)
           ============================================ */
        #splashScreen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        #splashScreen.hidden {
            opacity: 0;

        }
        .splash-logo {
            width: 120px;

            display: flex;
            align-items: center;

        }
        .splash-logo i {

        }
        .splash-text {
            margin-top: 24px;
            font-size: 32px;
            font-weight: 900;
            color: white;
            letter-spacing: 2px;
        }
        .splash-text span {

        .splash-loader {

            border-top-color: white;

        }
        .splash-sub {
            margin-top: 16px;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            font-weight: 400;
        }
    </style>
</head>
