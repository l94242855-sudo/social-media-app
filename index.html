<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7C3AED" />
    <title>Social Media App</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        /* ===== KEEP ALL YOUR EXISTING STYLES ===== */
        /* (Copy your current styles section here - it's the same as before) */
        
        /* ===== ADD THIS NEW STYLE FOR NOTIFICATION BUTTON ===== */
        .notif-btn {
            margin: 8px auto;
            padding: 8px 24px;
            font-size: 13px;
        }
        .notif-btn i { margin-right: 8px; }
        
        /* ===== PUSH NOTIFICATION PERMISSION BANNER ===== */
        .notif-banner {
            background: var(--card);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: none;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .notif-banner.active { display: flex; }
        .notif-banner p {
            font-size: 13px;
            color: var(--text-light);
            margin: 0;
        }
        .notif-banner p strong { color: var(--text); }
        .notif-banner .btn {
            padding: 6px 16px;
            font-size: 12px;
            flex-shrink: 0;
        }
        
        .toast {
            padding: 14px 20px;
            background: #1E293B;
            color: white;
            border-radius: 12px;
            animation: slideUp 0.3s ease;
            box-shadow: var(--shadow-lg);
            max-width: 350px;
            margin-bottom: 8px;
        }
        .toast.success { border-left: 4px solid #10B981; }
        .toast.error { border-left: 4px solid #EF4444; }
        .toast.info { border-left: 4px solid #7C3AED; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Rest of your styles... */
    </style>
</head>
<body>

    <!-- ===== ALL YOUR EXISTING HTML ===== -->
    <!-- (Copy your current HTML - auth screen, OTP screen, chat screen, etc.) -->
    
    <!-- ===== ADD NOTIFICATION BANNER (after stories bar) ===== -->
    <div id="notifBanner" class="notif-banner">
        <p><i class="fas fa-bell" style="color:var(--primary);"></i> 
        <strong>Enable notifications</strong> to stay updated when someone likes, comments, or follows you.</p>
        <button class="btn btn-primary" id="enableNotifBtn">
            <i class="fas fa-check"></i> Enable
        </button>
        <button class="btn btn-outline" id="dismissNotifBtn" style="padding:6px 12px;font-size:12px;">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- ===== REST OF YOUR HTML ===== -->
    
    <!-- ===== SCRIPTS ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

    <script>
        // ============================================
        // FIREBASE CONFIG
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyCl0CpUJcMMll8klL0ldN22KwbUlCgaw2Q",
            authDomain: "social-media-app-bc2b9-ac852.firebaseapp.com",
            projectId: "social-media-app-bc2b9-ac852",
            storageBucket: "social-media-app-bc2b9-ac852.firebasestorage.app",
            messagingSenderId: "427918763507",
            appId: "1:427918763507:web:82ba7c8e787eaaccc2de86"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        db.enablePersistence().catch(err => console.warn('Persistence error:', err));

        // ============================================
        // PUSH NOTIFICATIONS CONFIG
        // ============================================
        const VAPID_KEY = "BFDQ8jBDuYoidunRBgbmZkIe2x60_8kUasdPxEKmT1Ps6XNbITkZJx6a_040ljoMcodiSQwr7VrcC5OI0_DcCac";

        // ============================================
        // YOUR EXISTING CODE HERE
        // (All your existing functions - showToast, formatTime, OTP handling, navigation, auth, etc.)
        // ============================================

        // ============================================
        // ===== NEW: PUSH NOTIFICATIONS =====
        // ============================================

        // Request notification permission
        async function requestNotificationPermission() {
            if (!('Notification' in window)) {
                showToast('Notifications not supported in this browser', 'error');
                return;
            }
            
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    showToast('Notifications enabled! 🔔', 'success');
                    await registerPushSubscription();
                } else {
                    showToast('Notifications blocked. Please enable in browser settings.', 'error');
                }
            } catch (error) {
                console.error('Error requesting notification permission:', error);
                showToast('Failed to enable notifications', 'error');
            }
        }

        // Register push subscription
        async function registerPushSubscription() {
            try {
                const registration = await navigator.serviceWorker.ready;
                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: VAPID_KEY
                });
                
                console.log('✅ Push subscription created');
                
                // Save to Firestore
                if (currentUser) {
                    await db.collection('users').doc(currentUser.uid).update({
                        pushSubscription: subscription.toJSON()
                    });
                    console.log('✅ Subscription saved to Firestore');
                    document.getElementById('notifBanner')?.classList.remove('active');
                }
                
                return subscription;
            } catch (error) {
                console.error('❌ Push registration error:', error);
                if (error.message.includes('ApplicationServerKey')) {
                    showToast('Invalid VAPID key configuration', 'error');
                } else {
                    showToast('Failed to register for notifications', 'error');
                }
            }
        }

        // Send notification to a user
        async function sendNotificationToUser(userId, notificationData) {
            try {
                const userDoc = await db.collection('users').doc(userId).get();
                const userData = userDoc.data();
                
                if (!userData || !userData.pushSubscription) {
                    console.log('ℹ️ User has no push subscription');
                    return;
                }
                
                // Use Firebase Cloud Messaging
                const response = await fetch('https://fcm.googleapis.com/fcm/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'key=AAAALxrO5Xg:APA91bFjXZzQhQ0kG0AhYAh_0qgS7Fd-65sE2Qq6-bQ0tX_RfqB7jLrLxH5cJxhS4eGXJ8Ydrv9QRdQn3b5BmB7lH2S3wZzXyYvQ'
                    },
                    body: JSON.stringify({
                        to: userData.pushSubscription.endpoint,
                        notification: {
                            title: notificationData.title || 'Social App',
                            body: notificationData.body || 'You have a new notification!',
                            icon: '/icons/icon-192.png',
                            badge: '/icons/badge.png'
                        },
                        data: {
                            url: notificationData.url || '/',
                            type: notificationData.type || 'general',
                            fromUserId: notificationData.fromUserId || ''
                        }
                    })
                });
                
                const result = await response.json();
                console.log('📨 Notification sent:', result);
                return result;
            } catch (error) {
                console.error('❌ Error sending notification:', error);
            }
        }

        // ============================================
        // ===== UPDATED: TRIGGER NOTIFICATIONS =====
        // ============================================

        // Override toggleLike to send notification
        const originalToggleLike = window.toggleLike;
        window.toggleLike = async (postId) => {
            if (!currentUser) return;
            const postRef = db.collection('posts').doc(postId);
            const doc = await postRef.get();
            const data = doc.data();
            const likes = data.likes || [];
            const index = likes.indexOf(currentUser.uid);
            
            if (index > -1) {
                likes.splice(index, 1);
            } else {
                likes.push(currentUser.uid);
                // Send notification to post owner
                if (data.userId !== currentUser.uid) {
                    sendNotificationToUser(data.userId, {
                        title: '❤️ New Like!',
                        body: `${currentUserData.name} liked your post`,
                        type: 'like',
                        fromUserId: currentUser.uid,
                        url: '/'
                    });
                }
            }
            await postRef.update({ likes });
        };

        // Override addComment to send notification
        const originalAddComment = window.addComment;
        window.addComment = async (postId) => {
            const input = document.getElementById(`commentInput-${postId}`);
            const text = input.value.trim();
            if (!text || !currentUser) return;
            
            const postRef = db.collection('posts').doc(postId);
            const doc = await postRef.get();
            const data = doc.data();
            const comments = data.comments || [];
            comments.push({
                userId: currentUser.uid,
                username: currentUserData.name,
                userPhoto: currentUserData.photoURL,
                text: text,
                createdAt: new Date().toISOString()
            });
            
            // Send notification to post owner
            if (data.userId !== currentUser.uid) {
                sendNotificationToUser(data.userId, {
                    title: '💬 New Comment!',
                    body: `${currentUserData.name}: "${text.substring(0, 40)}${text.length > 40 ? '...' : ''}"`,
                    type: 'comment',
                    fromUserId: currentUser.uid,
                    url: '/'
                });
            }
            
            await postRef.update({ comments });
            input.value = '';
        };

        // Override followUser to send notification
        const originalFollowUser = window.followUser;
        window.followUser = async (userId) => {
            if (!currentUser) return;
            const userRef = db.collection('users').doc(currentUser.uid);
            const doc = await userRef.get();
            const data = doc.data();
            const following = data.following || [];
            
            if (!following.includes(userId)) {
                following.push(userId);
                await userRef.update({ following });
                
                // Send notification
                if (userId !== currentUser.uid) {
                    sendNotificationToUser(userId, {
                        title: '👤 New Follower!',
                        body: `${currentUserData.name} started following you`,
                        type: 'follow',
                        fromUserId: currentUser.uid,
                        url: '/'
                    });
                }
                showToast('Followed!', 'success');
            }
        };

        // ============================================
        // ===== NOTIFICATION UI =====
        // ============================================

        // Show notification banner if user hasn't enabled notifications
        function checkNotificationStatus() {
            if (!('Notification' in window)) return;
            
            const banner = document.getElementById('notifBanner');
            if (!banner) return;
            
            if (Notification.permission === 'default') {
                banner.classList.add('active');
            } else if (Notification.permission === 'granted') {
                banner.classList.remove('active');
                // Try to register subscription if not already
                navigator.serviceWorker.ready.then(registration => {
                    registration.pushManager.getSubscription().then(sub => {
                        if (!sub) {
                            registerPushSubscription();
                        }
                    });
                });
            }
        }

        // Enable notifications button
        document.getElementById('enableNotifBtn')?.addEventListener('click', requestNotificationPermission);

        // Dismiss banner
        document.getElementById('dismissNotifBtn')?.addEventListener('click', () => {
            document.getElementById('notifBanner')?.classList.remove('active');
        });

        // ============================================
        // ===== INITIALIZE =====
        // ============================================
        // Call checkNotificationStatus when user logs in
        // Add this to your handleUserLoggedIn function:
        // setTimeout(checkNotificationStatus, 2000);

        // ============================================
        // REST OF YOUR CODE (Maintain all existing functions)
        // ============================================
        // (Your existing functions: showToast, formatTime, OTP handling, navigation, auth, loadFeed, renderFeed, etc.)
        // Make sure all your existing code is preserved below this line
        // ...

        console.log('🚀 Social Media App loaded with PUSH NOTIFICATIONS!');
        console.log('🔔 Notifications enabled for likes, comments, and follows');
    </script>
</body>
</html>
